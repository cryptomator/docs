name: Build site

on:
  pull_request:
  workflow_call:
    inputs:
      site-url:
        description: Base url for the hosting site
        type: string
        required: false
    outputs:
      artifact-id:
        description: ID of the uploaded artifact
        value: ${{jobs.build.outputs.artifact-id}}

env:
  SITE_URL: ${{ inputs.site-url || 'https://docs.staging.cryptomator.org'}}

permissions:
  contents: read # Required for checkout
  pages: read # Required for actions/configure-pages

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{steps.upload.outputs.artifact-id}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify lockfile has no non-registry sources
        run: scripts/check-lockfile.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: site
          path: './build'