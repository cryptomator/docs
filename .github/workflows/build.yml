name: Build site

on:
  pull_request:
  workflow_call:
    inputs:
      site-url:
        description: Base url for the hosting site
        type: string
        required: false
    outputs:
      artifact-id:
        description: ID of the uploaded artifact
        value: ${{jobs.build.outputs.artifact-id}}

env:
  SITE_URL: ${{ inputs.site-url || 'https://docs.staging.cryptomator.org'}}

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{steps.upload.outputs.artifact-id}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify lockfile has no non-registry sources
        run: scripts/check-lockfile.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: site
          path: './build'