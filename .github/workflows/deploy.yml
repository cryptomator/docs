name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  # BUILD
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Verify lockfile has no non-registry sources
        run: scripts/check-lockfile.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production
        run: pnpm run build
      - name: Upload Prod Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: prod-site
          path: './build'
      - name: Build staging
        run: pnpm run build
        env:
          SITE_URL: https://docs.staging.cryptomator.org
      - name: Add robots.txt for staging
        run: 'echo -e "User-agent: *\nDisallow: /" > build/robots.txt'
      - name: Upload Staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-site
          path: './build'

  # DEPLOY PROD
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    name: Deploy Prod to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: prod-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

  # DEPLOY STAGING
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    name: Deploy Staging to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-site
          path: ./public
      - name: Deploy to Staging Repository
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          personal_token: ${{ secrets.CRYPTOBOT_DEPLOY_STAGING_DOCS }}
          external_repository: cryptomator/docs-staging
          publish_dir: ./public
          publish_branch: main
          cname: docs.staging.cryptomator.org
