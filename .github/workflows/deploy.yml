name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  # BUILD
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify lockfile has no non-registry sources
        run: scripts/check-lockfile.sh
      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production
        run: pnpm run build
      - name: Upload Prod Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: prod-site
          path: './build'
      - name: Build staging
        run: pnpm run build
        env:
          SITE_URL: https://docs.staging.cryptomator.org
      - name: Add robots.txt for staging
        run: 'echo -e "User-agent: *\nDisallow: /" > build/robots.txt'
      - name: Upload Staging artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-site
          path: './build'

  # DEPLOY PROD
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    name: Deploy Prod to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: prod-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

  # DEPLOY STAGING
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    name: Deploy Staging to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-site
          path: ./public
      - name: Deploy to Staging Repository
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          personal_token: ${{ secrets.CRYPTOBOT_DEPLOY_STAGING_DOCS }}
          external_repository: cryptomator/docs-staging
          publish_dir: ./public
          publish_branch: main
          cname: docs.staging.cryptomator.org
